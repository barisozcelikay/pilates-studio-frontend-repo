<div class="toast-container">
  <div
    *ngFor="let toast of toasts"
    class="toast"
    [class.toast-success]="toast.type === 'success'"
    [class.toast-error]="toast.type === 'error'"
    [class.toast-warning]="toast.type === 'warning'"
    [class.toast-info]="toast.type === 'info'"
  >
    <div class="toast-icon">
      <i
        class="pi"
        [class.pi-check-circle]="toast.type === 'success'"
        [class.pi-times-circle]="toast.type === 'error'"
        [class.pi-exclamation-triangle]="toast.type === 'warning'"
        [class.pi-info-circle]="toast.type === 'info'"
      ></i>
    </div>

    <div class="toast-message">
      {{ toast.message }}
    </div>

    <button type="button" class="toast-close" aria-label="Kapat" (click)="close(toast.id)">
      <i class="pi pi-times"></i>
    </button>
  </div>
</div>
