<div class="dashboard" [class.sidebar-open]="sidebarOpen" [class.dark-mode]="isDarkTheme">
  <div class="sidebar-overlay" [class.visible]="sidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand" aria-label="Olive Pilates Studio">
      <div class="theme-logo" aria-hidden="true">
        <img
          class="theme-logo-image theme-logo-light"
          src="/images/olive-logo-light-transparent-v3.png"
          alt=""
        />
        <img
          class="theme-logo-image theme-logo-dark"
          src="/images/olive-logo-dark-crisp-transparent-v4.png"
          alt=""
        />
      </div>
    </div>

    <nav class="sidebar-nav">
      @for (menu of menuItemModels; track menu.id) {
        @if (menu.children.length) {
          <button
            type="button"
            class="nav-item nav-parent"
            [class.expanded]="isMenuExpanded(menu.id!)"
            (click)="toggleMenu(menu.id!)"
          >
            @if (menu.icon) {
              <i [class]="menu.icon"></i>
            }

            <span>{{ menu.name }}</span>

            <i class="pi pi-chevron-down nav-arrow" [class.rotated]="isMenuExpanded(menu.id!)"></i>
          </button>

          @if (isMenuExpanded(menu.id!)) {
            <div class="nav-children">
              @for (child of menu.children; track child.id) {
                <a
                  class="nav-item nav-child"
                  [routerLink]="child.route"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  (click)="closeSidebar()"
                >
                  @if (child.icon) {
                    <i [class]="child.icon"></i>
                  }

                  <span>{{ child.name }}</span>
                </a>
              }
            </div>
          }
        } @else {
          <a
            class="nav-item"
            [routerLink]="menu.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
          >
            @if (menu.icon) {
              <i [class]="menu.icon"></i>
            }

            <span>{{ menu.name }}</span>
          </a>
        }
      }
    </nav>

    <!-- Sidebar footer -->

    <div class="sidebar-footer">
      <span class="app-version">v1.0.0</span>
    </div>
  </aside>

  <!-- Main content -->

  <main class="main-content">
    <!-- Topbar -->

    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Menüyü aç"
          (click)="toggleSidebar()"
        >
          <i class="pi pi-bars"></i>
        </button>
      </div>

      <div class="topbar-actions">
        <!-- Mobile menu button -->

        <button
          type="button"
          class="icon-button theme-toggle"
          aria-label="Temayı değiştir"
          (click)="toggleTheme()"
        >
          <i class="pi" [class.pi-moon]="!isDarkTheme" [class.pi-sun]="isDarkTheme"></i>
        </button>
        <!-- Notifications -->

        <button type="button" class="icon-button" aria-label="Bildirimler">
          <i class="pi pi-bell"></i>

          <span class="notification-dot"></span>
        </button>

        <!-- User -->

        <div class="topbar-user">
          <button type="button" class="topbar-user-button" (click)="toggleUserMenu()">
            <div class="user-avatar">
              {{ currentAccount?.firstName?.charAt(0) }}
            </div>

            <div class="topbar-user-info">
              <strong>
                {{ currentAccount?.firstName }}
                {{ currentAccount?.lastName }}
              </strong>

              <span>{{ currentAccount?.profileName }}</span>
            </div>

            <i class="pi pi-chevron-down"></i>
          </button>

          @if (userMenuOpen) {
            <div class="user-menu">
              <button type="button">
                <i class="pi pi-cog"></i>
                <span>Ayarlar</span>
              </button>

              <div class="user-menu-divider"></div>

              <button type="button" (click)="logout()">
                <i class="pi pi-sign-out"></i>
                <span>Çıkış Yap</span>
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <!-- Dashboard content -->

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
