<div class="page">
  <div class="page-header">
    <div class="page-header-content">
      <span class="page-eyebrow">HİZMET YÖNETİMİ</span>
      <h1 class="page-title">Hizmetler</h1>
      <p class="page-description">Stüdyonuzda sunulan hizmetleri yönetin.</p>
    </div>
    <button class="primary-button" (click)="openCreateForm()">
      <i class="pi pi-plus"></i> Yeni Hizmet
    </button>
  </div>
  <div class="card">
    <div class="table-container">
      <p-table class="data-table" [value]="items" [loading]="loading"
        ><ng-template #header
          ><tr>
            <th>Kod</th>
            <th>Hizmet</th>
            <th>Açıklama</th>
            <th>Durum</th>
            <th>İşlemler</th>
          </tr></ng-template
        ><ng-template #body let-item
          ><tr>
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.description || '—' }}</td>
            <td>{{ item.active ? 'Aktif' : 'Pasif' }}</td>
            <td>
              <div class="table-actions">
                <button class="table-action table-action-edit" (click)="openEditForm(item)">
                  <i class="pi pi-pencil"></i></button
                ><button class="table-action table-action-delete" (click)="confirmDelete(item)">
                  <i class="pi pi-trash"></i>
                </button>
              </div>
            </td></tr></ng-template
      ></p-table>
    </div>
  </div>
</div>
<app-drawer [(visible)]="drawerVisible" [title]="editing ? 'Hizmeti Düzenle' : 'Yeni Hizmet'"
  ><div class="form">
    <div class="form-group">
      <label class="form-label">Kod</label
      ><input pInputText [(ngModel)]="form.code" [readonly]="editing" />
    </div>
    <div class="form-group">
      <label class="form-label">Hizmet Adı</label><input pInputText [(ngModel)]="form.name" />
    </div>
    <div class="form-group">
      <label class="form-label">Açıklama</label><input pInputText [(ngModel)]="form.description" />
    </div>
    <div class="form-checkbox">
      <p-checkbox [(ngModel)]="form.active" [binary]="true" inputId="service-active" /><label
        class="form-label"
        for="service-active"
        >Aktif</label
      >
    </div>
  </div>
  <div drawer-footer>
    <div class="button-group">
      <button class="secondary-button" (click)="drawerVisible = false">İptal</button
      ><button class="primary-button" (click)="save()">Kaydet</button>
    </div>
  </div></app-drawer
><app-confirm-dialog
  [(visible)]="confirmVisible"
  title="Hizmeti Sil"
  [message]="
    itemToDelete ? '“' + itemToDelete.name + '” hizmetini silmek istediğinize emin misiniz?' : ''
  "
  (confirm)="delete()"
/>
