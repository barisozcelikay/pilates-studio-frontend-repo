<div
  class="dashboard"
  [class.sidebar-open]="sidebarOpen"
>

  <div
    class="sidebar-overlay"
    [class.visible]="sidebarOpen"
    (click)="closeSidebar()"
  ></div>

  <aside
    class="sidebar"
    [class.open]="sidebarOpen"
  >

    <div class="sidebar-brand">

      <div class="brand-mark">
        D
      </div>

      <div class="brand-text">
        <strong>Denge Pilates</strong>
        <span>Yönetim Paneli</span>
      </div>

    </div>


    <nav class="sidebar-nav">

      <a
        class="nav-item active"
        (click)="closeSidebar()"
      >
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </a>


      <a
        class="nav-item"
        (click)="closeSidebar()"
      >
        <i class="pi pi-users"></i>
        <span>Üyeler</span>
      </a>


      <a
        class="nav-item"
        (click)="closeSidebar()"
      >
        <i class="pi pi-user-edit"></i>
        <span>Eğitmenler</span>
      </a>


      <a
        class="nav-item"
        (click)="closeSidebar()"
      >
        <i class="pi pi-calendar"></i>
        <span>Dersler</span>
      </a>


      <a
        class="nav-item"
        (click)="closeSidebar()"
      >
        <i class="pi pi-calendar-clock"></i>
        <span>Takvim</span>
      </a>


      <a
        class="nav-item"
        (click)="closeSidebar()"
      >
        <i class="pi pi-wallet"></i>
        <span>Ödemeler</span>
      </a>


      <div class="nav-divider"></div>


      <a
        class="nav-item"
        (click)="closeSidebar()"
      >
        <i class="pi pi-cog"></i>
        <span>Ayarlar</span>
      </a>

    </nav>


    <!-- Sidebar footer -->

    <div class="sidebar-footer">

      <div class="user-mini">

        <div class="user-avatar">
          A
        </div>

        <div class="user-info">
          <strong>Admin</strong>
          <span>Yönetici</span>
        </div>

      </div>

    </div>

  </aside>


  <!-- Main content -->

  <main class="main-content">


    <!-- Topbar -->

    <header class="topbar">

      <div class="topbar-left">

        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Menüyü aç"
          (click)="toggleSidebar()"
        >
          <i class="pi pi-bars"></i>
        </button>



      </div>



      <div class="topbar-actions">


        <!-- Mobile menu button -->

        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Menüyü aç"
          (click)="toggleSidebar()"
        >
          <i class="pi pi-bars"></i>
        </button>


        <!-- Notifications -->

        <button
          type="button"
          class="icon-button"
          aria-label="Bildirimler"
        >
          <i class="pi pi-bell"></i>

          <span class="notification-dot"></span>
        </button>


        <!-- User -->

        <div class="topbar-user">

          <div class="user-avatar">
            A
          </div>

          <div class="topbar-user-info">
            <strong>Admin</strong>
            <span>Yönetici</span>
          </div>

          <i class="pi pi-chevron-down"></i>

        </div>

      </div>

    </header>


    <!-- Dashboard content -->

    <section class="dashboard-content">





      <div class="dashboard-placeholder">

        <i class="pi pi-chart-line"></i>

        <h2>
          Dashboard hazırlanıyor
        </h2>

        <p>
          Üye, ders, ödeme ve günlük aktivite özetleri
          burada yer alacak.
        </p>

      </div>


    </section>

  </main>

</div>
